<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Editor - NUST Timetable Manager</title>

    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- NAVIGATION -->
    <nav class="navbar">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">
          <img
            src="logo.png"
            alt="NUST Logo"
            class="navbar-logo"
            width="140"
            height="60"
          />
          &nbsp; Timetable Manager
        </a>

        <button class="navbar-toggle" onclick="toggleMobileMenu()">
          <i class="fas fa-bars"></i>
        </button>

        <div class="navbar-menu" id="navbarMenu">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">
                <i class="fas fa-home"></i> Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="btn btn-login" href="#" onclick="saveSchedule()">
                <i class="fas fa-save"></i> Save
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- EDITOR CONTAINER -->
    <div class="editor-container">
      <!-- COURSES SIDEBAR -->
      <aside class="courses-sidebar">
        <div class="sidebar-header">
          <h3 style="margin-bottom: 0.5rem">
            <i class="fas fa-book"></i> Available Courses
          </h3>
          <p style="margin: 0; opacity: 0.9; font-size: 0.9rem">
            Drag courses onto the timetable
          </p>

          <div class="sidebar-search">
            <i class="fas fa-search"></i>
            <input
              type="text"
              placeholder="Search courses..."
              id="courseSearchInput"
              onkeyup="filterCourses()"
            />
          </div>
        </div>

        <div class="courses-list" id="coursesList">
          <!-- Courses will be populated by JavaScript -->
        </div>
      </aside>

      <!-- MAIN EDITOR -->
      <main class="editor-main">
        <!-- Toolbar -->
        <div class="editor-toolbar">
          <div class="schedule-title-display" id="scheduleTitle">
            Semester 2 - Final Schedule
          </div>

          <div class="toolbar-actions">
            <button class="btn btn-outline btn-sm" onclick="clearSchedule()">
              <i class="fas fa-trash"></i> Clear
            </button>
            <button class="btn btn-outline btn-sm" onclick="undoLastAction()">
              <i class="fas fa-undo"></i> Undo
            </button>
            <button class="btn btn-secondary btn-sm" onclick="saveSchedule()">
              <i class="fas fa-save"></i> Save
            </button>
            <button class="btn btn-primary btn-sm" onclick="viewSchedule()">
              <i class="fas fa-eye"></i> Preview
            </button>
          </div>
        </div>

        <!-- Timetable Grid -->
        <div class="timetable-container">
          <div class="timetable-grid" id="timetableGrid">
            <!-- Grid will be generated by JavaScript -->
          </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
          <div class="stat-item">
            <div class="stat-value" id="totalCourses">0</div>
            <div class="stat-label">Courses</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="totalCredits">0</div>
            <div class="stat-label">Total Credits</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="totalHours">0</div>
            <div class="stat-label">Contact Hours</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="conflictCount">0</div>
            <div class="stat-label">Conflicts</div>
          </div>
        </div>
      </main>
    </div>

    <!-- JQuery -->
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js](https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js)"></script>

    <!-- Main JS-->
    <script src="scripts/app.js"></script>

    <!-- JAVASCRIPT -->
    <script>
      /**
       * Schedule Editor JavaScript
       * Implements drag-and-drop timetable building with conflict detection
       */

      // Time slots for the timetable (08:00 - 17:00)
      const timeSlots = [
        "07:30",
        "08:30",
        "09:30",
        "10:30",
        "11:30",
        "12:30",
        "14:00",
        "15:00",
        "16:00",
        "17:15",
        "18:40",
        "20:00",
      ];

      const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

      // Available courses - in production, fetch from PHP/MySQL
      const availableCourses = [
        {
          code: "WAD621S",
          name: "Web Application Development",
          credits: 12,
          lecturer: "Dr. S. Muchinenyika",
          color: "#3b82f6",
        },
        {
          code: "DTA621S",
          name: "Data Analytics",
          credits: 12,
          lecturer: "Prof. G. Iyawa",
          color: "#10b981",
        },
        {
          code: "ITD621S",
          name: "Interaction Design",
          credits: 12,
          lecturer: "Dr. G. Koch Kapuire",
          color: "#8b5cf6",
        },
        {
          code: "DSA612S",
          name: "Distributed Systems",
          credits: 12,
          lecturer: "Prof. D. S. Jat",
          color: "#f59e0b",
        },
        {
          code: "SDN621S",
          name: "Software Design",
          credits: 12,
          lecturer: "Mrs. S. Chivuno-Kuria",
          color: "#ef4444",
        },
        {
          code: "EFC621S",
          name: "Ethics for Computing",
          credits: 10,
          lecturer: "Cross-departmental",
          color: "#6366f1",
        },
      ];

      // Current schedule state - stores courses placed on the grid
      let schedule = {};

      // Undo stack for undo functionality
      let undoStack = [];

      // Currently dragging course
      let draggedCourse = null;

      /**
       * Initialize the editor on page load
       */
      document.addEventListener("DOMContentLoaded", function () {
        generateTimetableGrid();
        populateCoursesList();
        updateStats();
      });

      /**
       * Generate the timetable grid structure
       */
      function generateTimetableGrid() {
        const grid = document.getElementById("timetableGrid");
        grid.innerHTML = "";

        // Top-left corner cell (empty)
        const corner = document.createElement("div");
        corner.className = "time-label";
        corner.textContent = "Time";
        grid.appendChild(corner);

        // Day headers
        days.forEach((day) => {
          const header = document.createElement("div");
          header.className = "day-header";
          header.textContent = day;
          grid.appendChild(header);
        });

        // Time slots and cells
        timeSlots.forEach((time) => {
          // Time label
          const timeLabel = document.createElement("div");
          timeLabel.className = "time-label";
          timeLabel.textContent = time;
          grid.appendChild(timeLabel);

          // Day cells for this time slot
          days.forEach((day) => {
            const cell = document.createElement("div");
            cell.className = "time-slot";
            cell.dataset.day = day;
            cell.dataset.time = time;

            // Make cells drop targets
            cell.addEventListener("dragover", handleDragOver);
            cell.addEventListener("drop", handleDrop);
            cell.addEventListener("dragleave", handleDragLeave);

            grid.appendChild(cell);
          });
        });
      }

      /**
       * Populate the courses sidebar
       */
      function populateCoursesList() {
        const list = document.getElementById("coursesList");
        list.innerHTML = "";

        availableCourses.forEach((course) => {
          const item = createCourseItem(course);
          list.appendChild(item);
        });
      }

      /**
       * Create a draggable course item
       */
      function createCourseItem(course) {
        const item = document.createElement("div");
        item.className = "course-item";
        item.draggable = true;
        item.dataset.courseCode = course.code;

        item.innerHTML = `
                <div class="course-code">${course.code}</div>
                <div class="course-name">${course.name}</div>
                <div class="course-meta">
                    <i class="fas fa-star"></i> ${course.credits} credits &nbsp;
                    <i class="fas fa-user"></i> ${course.lecturer}
                </div>
            `;

        // Drag event listeners
        item.addEventListener("dragstart", handleDragStart);
        item.addEventListener("dragend", handleDragEnd);

        return item;
      }

      /**
       * Handle drag start
       */
      function handleDragStart(e) {
        this.classList.add("dragging");
        const courseCode = this.dataset.courseCode;
        draggedCourse = availableCourses.find((c) => c.code === courseCode);
        e.dataTransfer.effectAllowed = "copy";
      }

      /**
       * Handle drag end
       */
      function handleDragEnd(e) {
        this.classList.remove("dragging");
      }

      /**
       * Handle drag over drop zone
       */
      function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";

        // Visual feedback
        if (!this.querySelector(".scheduled-course")) {
          this.classList.add("valid-drop");
        } else {
          this.classList.add("invalid-drop");
        }
      }

      /**
       * Handle drag leave
       */
      function handleDragLeave(e) {
        this.classList.remove("valid-drop", "invalid-drop");
      }

      /**
       * Handle drop on time slot
       */
      function handleDrop(e) {
        e.preventDefault();
        this.classList.remove("valid-drop", "invalid-drop");

        if (!draggedCourse) return;

        const day = this.dataset.day;
        const time = this.dataset.time;

        // Check if slot is empty
        if (this.querySelector(".scheduled-course")) {
          alert("This time slot is already occupied!");
          return;
        }

        // Add to schedule
        const slotKey = `${day}-${time}`;
        schedule[slotKey] = { ...draggedCourse, day, time };

        // Save to undo stack
        undoStack.push(JSON.parse(JSON.stringify(schedule)));
        if (undoStack.length > 20) undoStack.shift(); // Keep last 20 actions

        // Render the course in the grid
        renderScheduledCourse(this, draggedCourse);

        // Update statistics
        updateStats();

        // Check for conflicts
        checkConflicts();

        draggedCourse = null;
      }

      /**
       * Render a course in a time slot
       */
      function renderScheduledCourse(cell, course) {
        const block = document.createElement("div");
        block.className = "scheduled-course";
        block.style.background = `linear-gradient(135deg, ${course.color}, ${course.color}dd)`;
        block.draggable = true;

        block.innerHTML = `
                <button class="remove-course" onclick="removeCourse(this)">
                    <i class="fas fa-times"></i>
                </button>
                <div class="scheduled-course-code">${course.code}</div>
                <div class="scheduled-course-name">${course.name}</div>
                <div class="scheduled-course-info">
                    <i class="fas fa-user"></i> ${course.lecturer}
                </div>
            `;

        cell.appendChild(block);
      }

      /**
       * Remove a course from the schedule
       */
      function removeCourse(button) {
        const block = button.closest(".scheduled-course");
        const cell = block.closest(".time-slot");
        const day = cell.dataset.day;
        const time = cell.dataset.time;
        const slotKey = `${day}-${time}`;

        // Save to undo stack
        undoStack.push(JSON.parse(JSON.stringify(schedule)));

        // Remove from schedule
        delete schedule[slotKey];

        // Remove from DOM
        block.remove();

        // Update stats
        updateStats();
        checkConflicts();
      }

      /**
       * Update statistics display
       */
      function updateStats() {
        const courses = Object.values(schedule);
        const totalCourses = new Set(courses.map((c) => c.code)).size;
        const totalCredits = courses.reduce((sum, c) => {
          // Only count each unique course once
          return sum;
        }, 0);

        // Calculate unique courses and their credits
        const uniqueCourses = {};
        courses.forEach((c) => {
          uniqueCourses[c.code] = c.credits;
        });
        const credits = Object.values(uniqueCourses).reduce((a, b) => a + b, 0);

        document.getElementById("totalCourses").textContent = totalCourses;
        document.getElementById("totalCredits").textContent = credits;
        document.getElementById("totalHours").textContent = courses.length;
      }

      /**
       * Check for scheduling conflicts
       */
      function checkConflicts() {
        // Reset conflict indicators
        document.querySelectorAll(".scheduled-course").forEach((block) => {
          block.classList.remove("conflict");
        });

        let conflictCount = 0;

        // Check for time overlaps (simplified - just checks if multiple courses same time)
        // In production, this would be more sophisticated

        document.getElementById("conflictCount").textContent = conflictCount;
      }

      /**
       * Filter courses in sidebar
       */
      function filterCourses() {
        const searchTerm = document
          .getElementById("courseSearchInput")
          .value.toLowerCase();
        const items = document.querySelectorAll(".course-item");

        items.forEach((item) => {
          const text = item.textContent.toLowerCase();
          item.style.display = text.includes(searchTerm) ? "block" : "none";
        });
      }

      /**
       * Clear entire schedule
       */
      function clearSchedule() {
        if (!confirm("Are you sure you want to clear the entire schedule?"))
          return;

        undoStack.push(JSON.parse(JSON.stringify(schedule)));
        schedule = {};

        document
          .querySelectorAll(".scheduled-course")
          .forEach((block) => block.remove());
        updateStats();
      }

      /**
       * Undo last action
       */
      function undoLastAction() {
        if (undoStack.length === 0) {
          alert("Nothing to undo");
          return;
        }

        schedule = undoStack.pop();

        // Re-render grid
        document
          .querySelectorAll(".scheduled-course")
          .forEach((block) => block.remove());

        Object.entries(schedule).forEach(([key, course]) => {
          const [day, time] = key.split("-");
          const cell = document.querySelector(
            `[data-day="${day}"][data-time="${time}"]`
          );
          if (cell) {
            renderScheduledCourse(cell, course);
          }
        });

        updateStats();
      }

      /**
       * Save schedule
       */
      function saveSchedule() {
        // In production, send to PHP backend
        console.log("Saving schedule:", schedule);

        // Simulate save
        const scheduleName =
          document.getElementById("scheduleTitle").textContent;
        localStorage.setItem(
          "currentSchedule",
          JSON.stringify({
            name: scheduleName,
            courses: schedule,
            lastSaved: new Date(),
          })
        );

        alert("Schedule saved successfully!");
      }

      /**
       * View schedule preview
       */
      function viewSchedule() {
        alert("Preview mode - Schedule would be displayed in read-only format");
      }

      // Navigation functions
      function toggleMobileMenu() {
        document.getElementById("navbarMenu").classList.toggle("active");
      }
    </script>

    <script>
      // Page-specific JavaScript can use the global NUSTApp object
      $(document).ready(function () {
        // Show a welcome notification
        NUSTApp.showNotification(
          "Welcome to the enhanced timetable manager!",
          "success"
        );

        // Load initial data
        loadPageData();

        // Custom form handling
        $("#customForm").on("submit", function (e) {
          e.preventDefault();

          if (NUSTApp.validateForm(this)) {
            submitCustomForm();
          }
        });
      });

      function loadPageData() {
        NUSTApp.showGlobalLoading();

        NUSTApp.dataLoader
          .loadData("/dashboard/stats.php")
          .then((data) => {
            displayDashboardData(data);
            NUSTApp.hideGlobalLoading();
          })
          .catch((error) => {
            NUSTApp.showNotification("Failed to load data", "error");
            NUSTApp.hideGlobalLoading();
          });
      }

      function displayDashboardData(data) {
        $("#statsContainer")
          .html(
            `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">${data.totalSchedules}</div>
                <div class="stat-label">Total Schedules</div>
            </div>
            <!-- More stats... -->
        </div>
    `
          )
          .addClass("fade-in");
      }

      // Custom notification examples
      function showSuccessMessage() {
        NUSTApp.showNotification("Schedule saved successfully!", "success");
      }

      function showErrorMessage() {
        NUSTApp.showNotification("An error occurred while saving", "error");
      }

      function showInfoMessage() {
        NUSTApp.showNotification("Auto-save enabled", "info");
      }
    </script>
  </body>
</html>
